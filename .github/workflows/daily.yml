name: Daily job scan

on:
  schedule:
    # 13:00 UTC = 7:00 am Calgary in summer (MDT), 6:00 am in winter (MST).
    # GitHub may start scheduled runs a few minutes to ~1 hour late.
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write   # to save state/state.json back to the repo

concurrency:
  group: daily-job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan boards and update the Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: node scripts/daily.mjs

      - name: Save seen-jobs state
        run: |
          git config user.name "hidden-job-finder[bot]"
          git config user.email "hidden-job-finder@users.noreply.github.com"
          git add state/state.json
          if git diff --cached --quiet; then
            echo "State unchanged."
          else
            git commit -m "Update job-scan state [skip ci]"
            git pull --rebase
            git push
          fi
